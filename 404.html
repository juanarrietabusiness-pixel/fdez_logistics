<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Página no encontrada · FDEZ Logistics</title>
<meta name="description" content="La página que buscas no existe o fue movida. Vuelve al inicio de FDEZ Logistics.">
<meta name="theme-color" content="#FF6B00">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="apple-touch-icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  /* Misma regla de color que el sitio: sobre naranja de marca, tinta oscura. */
  :root{
    --orange:#FF6B00;--orange-200:#FFB366;--orange-100:#FFC999;
    --orange-deep:#C24E00;--ink-brand:#2B1400;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100svh;display:grid;place-items:center;text-align:center;
    padding:clamp(20px,6vw,40px) clamp(16px,5vw,24px);
    padding-left:calc(clamp(16px,5vw,24px) + env(safe-area-inset-left,0px));
    padding-right:calc(clamp(16px,5vw,24px) + env(safe-area-inset-right,0px));
    padding-bottom:calc(clamp(20px,6vw,40px) + env(safe-area-inset-bottom,0px));
    background:linear-gradient(135deg,#FF6B00 0%,#FFB366 70%,#FFC999 100%);
    color:var(--ink-brand);line-height:1.6;overflow-wrap:break-word;
  }
  .card{max-width:560px}
  img{height:clamp(64px,18vw,96px);width:auto;border-radius:16px;background:#fff;padding:8px;margin:0 auto clamp(18px,4vw,26px);display:block}
  h1{font-size:clamp(64px,20vw,104px);font-weight:900;letter-spacing:-.04em;line-height:1}
  h2{font-size:clamp(18px,5vw,24px);font-weight:800;margin-top:6px;letter-spacing:-.02em}
  p{margin:10px 0 clamp(22px,5vw,30px);font-size:clamp(15px,4vw,17px)}
  a{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-height:52px;width:100%;max-width:320px;padding:16px 32px;border-radius:15px;
    background:#fff;color:var(--orange-deep);font-weight:800;font-size:clamp(15px,4vw,16px);
    text-decoration:none;transition:transform .2s ease,box-shadow .2s ease;
    box-shadow:0 10px 26px rgba(0,0,0,.16);
  }
  a:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(0,0,0,.22)}
  a:focus-visible{outline:3px solid var(--ink-brand);outline-offset:3px}
  @media (hover:none){a:hover{transform:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="card">
    <img src="logo.webp" alt="FDEZ Logistics">
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>La página que buscas no existe o fue movida.</p>
    <a href="./">Volver al inicio</a>
  </main>
</body>
</html>
