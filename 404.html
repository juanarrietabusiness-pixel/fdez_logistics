<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

  body{
    font-family:'Inter',system-ui,sans-serif;min-height:100vh;

  a{
    display:inline-block;padding:19px 32px;border-radius:15px;background:#fff;color:#FF6B00;
    font-weight:800;text-decoration:none;transition:transform .2s ease;
  }
  a:hover{transform:translateY(-3px)}

</head>
<body>
  <div>
    <img src="logo.webp" alt="FDEZ Logistics Logo">
